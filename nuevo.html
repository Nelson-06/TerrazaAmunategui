<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Terraza Amunategui</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }

    h1 {
      text-align: center;
    }

    .formulario {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input, button {
      padding: 8px;
      width: 100%;
      margin-top: 5px;
    }

    .comanda {
      border: 1px solid #000;
      padding: 15px;
      max-width: 400px;
      margin: auto;
      background: #fff;
    }

    .comanda h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .producto {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #ccc;
      padding: 5px 0;
    }

    .no-print {
      margin-top: 10px;
    }

    @media print {
      .no-print {
        display: none;
      }
      body {
        margin: 0;
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <h1>Terraza Amunategui SPA</h1>

  <div class="formulario no-print">
    <label>Nombre Cliente:</label>
    <input type="text" id="mesa" placeholder="">

    <label>Productos:</label>
    <input type="text" id="mesero" placeholder="Ej: Bebidas, Cafes, te, Etc">

    <label>¿Servir o Llevar?:</label>
    <input type="text" id="hora" placeholder="Ej: Servir, Llevar | 13:45">

    <label>Pedido:</label>
    <input type="text" id="producto" placeholder="Ej: menú,desayunos,comida rapida">

    <label>Cantidad:</label>
    <input type="number" id="cantidad" min="1" value="1">
    

    <button onclick="agregarProducto()">Agregar Producto</button>
    <button onclick="imprimirComanda()">Imprimir Comanda</button>
  </div>

  <div class="comanda" id="comanda">
    <h2>COMANDA</h2>
    <p><strong>Nombre del Cliente:</strong> <span id="comandaMesa"></span></p>
    <p><strong>Producto:</strong> <span id="comandaMesero"></span></p>
    <p><strong>¿Servir o Llevar?:</strong> <span id="comandaHora"></span></p>
    <hr>
    <div id="listaProductos"></div>
  </div>

  <script>
    function agregarProducto() {
      const mesa = document.getElementById('mesa').value;
      const mesero = document.getElementById('mesero').value;
      const producto = document.getElementById('producto').value;
      const cantidad = document.getElementById('cantidad').value;
      const hora = document.getElementById('hora').value;


      document.getElementById('comandaMesa').textContent = mesa;
      document.getElementById('comandaMesero').textContent = mesero;
      document.getElementById('comandaHora').textContent = hora;

      const lista = document.getElementById('listaProductos');
      const item = document.createElement('div');
      item.className = 'producto';
      item.innerHTML = `<span>${producto}</span><span>x${cantidad}</span>`;
      lista.appendChild(item);

      // Limpiar campos de producto y cantidad
      document.getElementById('producto').value = '';
      document.getElementById('cantidad').value = '1';
    }

    function imprimirComanda() {
      if (document.getElementById('listaProductos').children.length === 0) {
        alert('No hay productos para imprimir.');
        return;
      }
      window.print();
    }
  </script>

</body>
</html>
